<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My TV Guide - Maine Veterans' Homes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f9;
      color: #111111;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background-color: #163a70;
      color: #ffffff;
      padding: 24px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 22px;
      color: #e2e8f0;
    }

    /* Giant View Switcher Buttons */
    .view-controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .toggle-btn {
      flex: 1;
      padding: 22px 16px;
      font-size: 28px;
      font-weight: bold;
      border: 4px solid #163a70;
      border-radius: 14px;
      cursor: pointer;
      background-color: #ffffff;
      color: #163a70;
      transition: all 0.15s ease;
    }

    .toggle-btn.active {
      background-color: #163a70;
      color: #ffffff;
    }

    .day-section {
      margin-bottom: 36px;
    }

    .day-header {
      font-size: 30px;
      font-weight: bold;
      background-color: #dbeafe;
      color: #1e3a8a;
      padding: 14px 20px;
      border-radius: 10px;
      margin-bottom: 16px;
      border-left: 10px solid #163a70;
    }

    .program-card {
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.06);
    }

    .program-info {
      flex: 1;
    }

    .time-badge {
      display: inline-block;
      font-size: 24px;
      font-weight: bold;
      color: #9a3412;
      background-color: #ffedd5;
      padding: 6px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .category-tag {
      display: inline-block;
      font-size: 20px;
      font-weight: bold;
      color: #065f46;
      background-color: #d1fae5;
      padding: 6px 12px;
      border-radius: 8px;
      margin-left: 8px;
      margin-bottom: 8px;
    }

    .show-title {
      font-size: 32px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .channel-box {
      background-color: #163a70;
      color: #ffffff;
      padding: 16px 22px;
      border-radius: 12px;
      text-align: center;
      min-width: 175px;
    }

    .channel-label {
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .channel-number {
      font-size: 38px;
      font-weight: bold;
      margin: 4px 0;
    }

    .network-name {
      font-size: 22px;
      font-weight: bold;
      color: #fde047;
    }

    .empty-message {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 14px;
      font-size: 26px;
      text-align: center;
      border: 3px solid #cbd5e1;
    }

    footer {
      text-align: center;
      font-size: 18px;
      color: #475569;
      margin-top: 30px;
      padding-bottom: 20px;
    }

    @media (max-width: 650px) {
      .program-card {
        flex-direction: column;
        align-items: stretch;
      }
      .channel-box {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .toggle-btn {
        font-size: 22px;
        padding: 18px 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Favorite TV Shows</h1>
    <p id="current-date-display">Loading today's date...</p>
  </header>

  <div class="view-controls">
    <button id="btn-day" class="toggle-btn active" onclick="switchView('day')">
      📅 Today's Shows
    </button>
    <button id="btn-week" class="toggle-btn" onclick="switchView('week')">
      🗓️ Full Week
    </button>
  </div>

  <main id="guide-container"></main>

  <footer id="last-updated"></footer>

  <!-- Loads the data generated by update_guide.py -->
  <script src="guide_data.js"></script>
  <script>
    let currentView = 'day';

    // Display clear, easy-to-read current date at the top
    const now = new Date();
    const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
    document.getElementById('current-date-display').textContent =
      "Today is " + now.toISOString().split('T');

    function switchView(view) {
      currentView = view;
      document.getElementById('btn-day').classList.toggle('active', view === 'day');
      document.getElementById('btn-week').classList.toggle('active', view === 'week');
      renderGuide();
    }

    function renderGuide() {
      const container = document.getElementById('guide-container');
      container.innerHTML = '';

      if (!window.TV_GUIDE_DATA || !window.TV_GUIDE_DATA.days) {
        container.innerHTML = `
          <div class="empty-message">
            TV Guide data not found.<br><br>
            Please run <strong>update_guide.py</strong> first.
          </div>`;
        return;
      }

      document.getElementById('last-updated').textContent =
        "Guide updated: " + window.TV_GUIDE_DATA.lastUpdated;

      const daysToShow = currentView === 'day'
        ? [window.TV_GUIDE_DATA.days[0]]
        : window.TV_GUIDE_DATA.days;

      daysToShow.forEach(day => {
        const section = document.createElement('section');
        section.className = 'day-section';

        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = day.dayLabel;
        section.appendChild(header);

        if (!day.programs || day.programs.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-message';
          empty.textContent = "No scheduled favorites listed for this day.";
          section.appendChild(empty);
        } else {
          day.programs.forEach(prog => {
            const card = document.createElement('div');
            card.className = 'program-card';
            card.innerHTML = `
              <div class="program-info">
                <div>
                  <span class="time-badge">${prog.time}</span>
                  <span class="category-tag">${prog.category}</span>
                </div>
                <div class="show-title">${prog.title}</div>
              </div>
              <div class="channel-box">
                <div class="channel-label">Channel</div>
                <div class="channel-number">${prog.channel}</div>
                <div class="network-name">${prog.network}</div>
              </div>
            `;
            section.appendChild(card);
          });
        }

        container.appendChild(section);
      });
    }

    renderGuide();
  </script>
</body>
</html>
